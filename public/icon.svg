<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="androidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Icon Background (Rounded Squircle for Android MD3) -->
  <rect width="512" height="512" rx="112" fill="url(#androidGradient)" />
  
  <!-- Subtle inner glow grid -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Ladder Graphic & Metric Bars -->
  <!-- Ladder Left Stile -->
  <rect x="130" y="100" width="22" height="312" rx="10" fill="#FFFFFF" filter="url(#shadow)" />
  <!-- Ladder Right Stile -->
  <rect x="230" y="100" width="22" height="312" rx="10" fill="#FFFFFF" filter="url(#shadow)" />
  
  <!-- Ladder Rungs (Step Up Ramp) -->
  <rect x="142" y="150" width="98" height="18" rx="8" fill="#90CAF9" />
  <rect x="142" y="210" width="98" height="18" rx="8" fill="#64B5F6" />
  <rect x="142" y="270" width="98" height="18" rx="8" fill="#42A5F5" />
  <rect x="142" y="330" width="98" height="18" rx="8" fill="#2196F3" />
  <rect x="142" y="390" width="98" height="18" rx="8" fill="#1E88E5" />
  
  <!-- Ascending Production Ladder Target Curve -->
  <path d="M 270 380 Q 330 360 360 270 T 420 140" fill="none" stroke="url(#accentGradient)" stroke-width="20" stroke-linecap="round" />
  
  <!-- Target Milestone Nodes -->
  <circle cx="280" cy="375" r="14" fill="#00E676" />
  <circle cx="340" cy="310" r="14" fill="#00E676" />
  <circle cx="380" cy="220" r="14" fill="#00E676" />
  <circle cx="420" cy="140" r="18" fill="#00E676" stroke="#FFFFFF" stroke-width="6" />

  <!-- SMV Badge Pill -->
  <rect x="290" y="390" width="140" height="42" rx="21" fill="rgba(0,0,0,0.35)" />
  <text x="360" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SMV</text>
</svg>
